# BEGIN_KITTY_FONTS
font_family      family='Ioskeley Mono Term' style='Medium Semi-Condensed'
bold_font        family='Ioskeley Mono Term' style='Heavy Semi-Condensed'
italic_font      family='Ioskeley Mono Term' style='Medium Semi-Condensed Italic'
bold_italic_font family='Ioskeley Mono Term' style='Heavy Semi-Condensed Italic'
# END_KITTY_FONTS

font_size 11.5
modify_font cell_height 110%
disable_ligatures never

# BEGIN_KITTY_THEME
# Possible color themes to use: 
#
# Ayaka 
# Afterglow 
# Atelier Heath Dark
# Base2Tone Cave Dark
# Base2Tone Drawbridge Dark
# Base2Tone Heath Dark
# Base2Tone Lavener Dark
# Base2Tone Mall Dark
# Base2Tone Pool Dark
# Base2Tone Porch Dark
# Base2Tone Suburb Dark
# Base2Tone Classic_S Dark
# Base2Tone Classic_W Dark
# Black Metal
# Dainty Dark
# Dark Pride *
# Duskfox *
# Eldritch
# Ferra *
# HardHacker
# Heetch Dark * (current)
# Lavandula
# Love Ghost
# Midsummer Night *
# Mellow
# Paradiso Dark *
# Phanes *

include current-theme.conf
# END_KITTY_THEME

scrollback_lines 1000000

# BEGIN_KITTY_WINDOW_SETTINGS
window_border_width 0
window_border_width 0
remember_window_size yes
remember_window_position yes
hide_window_decorations yes
# END_KITTY_WINDOW_SETTINGS
