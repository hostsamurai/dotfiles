# ----------------------------------------------------------------------
# General options
# ----------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind a send-prefix

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-termite:Tc"
set -g default-shell "/bin/zsh"
set -g default-command "/bin/zsh"

# Moar scrollback
set -g history-limit 100000

# Status line
run '~/.tmux/plugins/tmux/catppuccin.tmux'

set-option -g status-position top

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_status "no"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_color "#{E:@thm_surface_2}"
set -g @catppuccin_status_module_text_bg "#{E:@thm_mantle}"

set -g status-left "#{E:@catppuccin_status_session}"
set -agF status-right "#{@catppuccin_status_gitmux}"

# Command Palette 
set -g @palette-key 'C-Space'
set -g @palette-find-pane-key 'M-f'
set -g @palette-move-pane-key 'M-m'

setw -g aggressive-resize on
setw -g mode-keys vi

set -g set-titles on

# Faster command sequence
set -s escape-time 0

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# Automatically set window title
setw -g automatic-rename off


# ----------------------------------------------------------------------
# Keybindings
# ----------------------------------------------------------------------

# Open new window in current directory
bind c new-window -c "#{pane_current_path}"

# More sane pane handling
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Last active window
bind C-a last-window

# Reload .tmux.conf
bind r source-file ~/.tmux.conf

# Copy contents of the tmux buffer into the system clipboard
set -g @yank_selection "clipboard"

# load tmux plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "joshmedeski/tmux-nerd-font-window-name"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-pain-control"
set -g @plugin "tmux-plugins/tmux-online-status"
set -g @plugin "tmux-plugins/tmux-copycat"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-sessionist"
set -g @plugin "Morantron/tmux-fingers"
set -g @plugin "schasse/tmux-jump"
set -g @plugin "MeinardEdrei/tmux-spotlight"
set -g @plugin "catppuccin/tmux" 
set -g @plugin "eduwass/tmux-palette"

# restore the last saved environment
set -g @continuum-restore "on"

run "tpack init"
